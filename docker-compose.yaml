services:
  controller:
    depends_on:
      db:
        condition: service_started
      valkey:
        condition: service_healthy
    image: ghcr.io/martina-ctf/ahaz:latest
    build:
      context: .
      dockerfile: ./Dockerfile.controller
    ports:
      - "5000:5000"
    volumes:
      - ./data/certs/:/certdir
      - ./data/kubectl:/.kube/
    environment:
      CERT_DIR_CONTAINER: "/certdir/"
      DB_IP: "db"
      DB_DBNAME: "ahaz"
      DB_USERNAME: "dbeaver"
      DB_PASSWORD: "dbeaver"
      REDIS_URL: "redis://valkey:6379"
      PUBLIC_DOMAINNAME: "ahaz.lan"
      K8S_IP_RANGE: "10.42.0.0 255.255.255.0"
      K8S_IMAGEPULLSECRET_NAME: "regcred"
      K8S_IMAGEPULLSECRET_NAMESPACE: "default"
      TEAM_PORT_RANGE_START: 31000
      TEAM_BACKUP_PORT_RANGE_START: 30500
      TEAM_BACKUP_PORT_RANGE_END: 30999
      LOGLEVEL: "DEBUG"
      OVPN_IMAGE: "lisenet/openvpn"
      OVPN_TAG: "2.6.14"
    networks:
      internal:
      default:
  db:
    image: mysql:9.5
    volumes:
      - ./data/mysqldb/mysqldb_volume:/var/lib/mysql
      - ./data/mysqldb/init.sh:/docker-entrypoint-initdb.d/init.sh
    environment:
      MYSQL_ROOT_PASSWORD: "shooch4SXe2iech9Aiv1do0pISuh8xeaahDe3WoTvoowae4Xahl0eZ1NDutaegh2"
      MYSQL_DATABASE: "ahaz"
      MYSQL_USER: "dbeaver"
      MYSQL_PASSWORD: "dbeaver"
    networks:
      internal:
  valkey:
    image: valkey/valkey:9.1.0-alpine
    restart: always
    volumes:
      - ./data/valkey:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 10s
      start_interval: 0.1s
    networks:
      internal:
networks:
  internal:
    driver: bridge
    internal: true
  default:
