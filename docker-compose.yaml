services:
  controller:
    depends_on:
      db:
        condition: service_started
    image: ghcr.io/martina-ctf/ahaz:latest
    build:
      context: .
      dockerfile: ./Dockerfile.controller
    ports:
      - "5000:5000"
    volumes:
      - ./ahaz_data/certs/:/certdir
      - ./ahaz_data/kubectl:/.kube/
    environment:
      CERT_DIR_CONTAINER: "/certdir/"
      DB_IP: "db"
      DB_DBNAME: "ahaz"
      DB_USERNAME: "mongodb"
      DB_PASSWORD: "I_LOVE_NOSQL!!!"
      REDIS_URL: "redis://redis:6379"
      PUBLIC_DOMAINNAME: "ahaz.lan"
      K8S_IP_RANGE: "10.42.0.0 255.255.255.0"
      K8S_IMAGEPULLSECRET_NAME: "regcred"
      K8S_IMAGEPULLSECRET_NAMESPACE: "default"
      TEAM_PORT_RANGE_START: 31000
      TEAM_BACKUP_PORT_RANGE_START: 30500
      TEAM_BACKUP_PORT_RANGE_END: 30999
      LOGLEVEL: "DEBUG"
      OVPN_IMAGE: "lisenet/openvpn"
      OVPN_TAG: "2.6.14"
    networks:
      internal:
      default:
  # db:
  #   image: mysql:9.5
  #   volumes:
  #     - ./ahaz_data/mysqldb/mysqldb_volume:/var/lib/mysql
  #     - ./ahaz_data/mysqldb/init.sh:/docker-entrypoint-initdb.d/init.sh
  #   environment:
  #     MYSQL_ROOT_PASSWORD: "shooch4SXe2iech9Aiv1do0pISuh8xeaahDe3WoTvoowae4Xahl0eZ1NDutaegh2"
  #     MYSQL_DATABASE: "ahaz"
  #     MYSQL_USER: "dbeaver"
  #     MYSQL_PASSWORD: "dbeaver"
  #   networks:
  #     internal:
  db: 
    image: mongo:8.3.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: "mongodb"
      MONGO_INITDB_ROOT_PASSWORD: "I_LOVE_NOSQL!!!"
      MONGO_INITDB_DATABASE: "ahaz"
      GLIBC_TUNABLES: "glibc.pthread.rseq=1" # fixes a bug in mongo where it hates newer kernels, see https://jira.mongodb.org/browse/SERVER-121912
    volumes:
      - ./ahaz_data/mongodb:/data/db
    networks:
      internal:
    # FIXME: Disable me in prod!
    ports:
      - "27017:27017"
  redis:
    image: redis:4
    restart: always
    volumes:
      - ./ahaz_data/redis:/data
    networks:
      internal:
networks:
  internal:
    driver: bridge
    internal: true
  default:
