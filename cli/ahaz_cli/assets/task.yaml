name: "very-cool-task"
version: "1.0.0"

info:
  name: "My Very Cool Task"
  description: "Very cool description UwU"
  flag: "flag{VAUEW_VAUEW_VAUEW_VAUEW!!!}"

pods:
  - name: hello-world
    visible: true
    exposed_ports:
      - 8080:8080
    image:
      name: hello-world
      context: ./hello-world
    limits:
      ram: 128Mi
      cpu: 100m
    network:
      - name: teamnet
    env:
      - name: "cool_var"
        value: "awesome_var"

networks:
  - name: teamnet
    access:
      - player
